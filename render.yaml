services:
  - type: web
    name: safe-ai-mailroom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 16 --timeout 120 --bind 0.0.0.0:$PORT mailroom_agent:app
    envVars:
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DB_PATH
        value: /tmp/mailroom.db
      - key: MAIL_PATH
        value: /v1/mailroom/actions
